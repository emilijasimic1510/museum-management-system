museum:
  mail:
    enabled: ${MUSEUM_MAIL_ENABLED:false}
    from: ${MUSEUM_MAIL_FROM:museum@localhost}
  image:
    storage-path: ${MUSEUM_IMAGE_STORAGE_PATH:./runtime/images}
    max-bytes: ${MUSEUM_IMAGE_MAX_BYTES:5242880}
  tts:
    provider: ${MUSEUM_TTS_PROVIDER:espeak}
    espeak-path: ${MUSEUM_TTS_ESPEAK_PATH:espeak-ng}
    timeout-seconds: ${MUSEUM_TTS_TIMEOUT_SECONDS:30}
    azure-key: ${MUSEUM_TTS_AZURE_KEY:}
    azure-region: ${MUSEUM_TTS_AZURE_REGION:}
    azure-voice: ${MUSEUM_TTS_AZURE_VOICE:sr-RS-SophieNeural}
    piper-python: ${MUSEUM_TTS_PIPER_PYTHON:python}
    piper-model: ${MUSEUM_TTS_PIPER_MODEL:}
  audio:
    storage-path: ${MUSEUM_AUDIO_STORAGE_PATH:./runtime/audio}
  text:
    storage-path: ${MUSEUM_TEXT_STORAGE_PATH:./runtime/text}

spring:
  mail:
    host: ${MUSEUM_MAIL_HOST:localhost}
    port: ${MUSEUM_MAIL_PORT:1025}
    username: ${MUSEUM_MAIL_USERNAME:}
    password: ${MUSEUM_MAIL_PASSWORD:}
    test-connection: false
    properties:
      mail.smtp.auth: ${MUSEUM_MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MUSEUM_MAIL_STARTTLS:false}
      mail.smtp.starttls.required: ${MUSEUM_MAIL_STARTTLS:false}
      mail.smtp.ssl.enable: ${MUSEUM_MAIL_SSL:false}
      mail.smtp.connectiontimeout: ${MUSEUM_MAIL_CONNECTION_TIMEOUT_MS:3000}
      mail.smtp.timeout: ${MUSEUM_MAIL_READ_TIMEOUT_MS:5000}
      mail.smtp.writetimeout: ${MUSEUM_MAIL_WRITE_TIMEOUT_MS:5000}
  servlet:
    multipart:
      max-file-size: ${MUSEUM_IMAGE_MAX_BYTES:5242880}B
      max-request-size: 6MB
  application:
    name: museum-backend
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties]"
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:15432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  neo4j:
    uri: bolt://${NEO4J_HOST:localhost}:${NEO4J_BOLT_PORT:7687}
    authentication:
      username: ${NEO4J_USERNAME}
      password: ${NEO4J_PASSWORD}

server:
  port: ${BACKEND_PORT:8081}

# PostgreSQL constraint details can contain submitted QR tokens. API errors are
# translated to generic ProblemDetail responses by ApiExceptionHandler.
logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: local
    import: classpath:local-server.yml
