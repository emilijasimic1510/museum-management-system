server:
  address: ${MUSEUM_BIND_ADDRESS:0.0.0.0}

museum:
  web:
    allowed-origins: ${MUSEUM_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    persist-authorization: false
  paths-to-match: /api/**
